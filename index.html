<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>Delbaz _EPS — محرر الفيديو</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Reem+Kufi&family=Lalezar&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{
  --bg:#0b0d11;--panel:#141820;--panel2:#1c222d;--line:#2a3140;
  --text:#eef1f6;--muted:#8a94a6;--accent:#2fd0a8;--accent2:#ffb02e;--danger:#ff5d5d;
  --cv:#3b6fd6;--ci:#2c9c86;--ct:#d9822b;--ca:#3aa65a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Cairo","Tajawal","Segoe UI",Roboto,Tahoma,sans-serif;font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--panel2);border-radius:10px;min-height:40px;padding:0 10px}
button:active{filter:brightness(1.3)}
button.on{background:var(--accent);color:#06241c;font-weight:700}
button.primary{background:var(--accent);color:#06241c;font-weight:700}
button.danger{color:var(--danger)}
button:disabled{opacity:.4}
.app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;height:48px;flex:0 0 auto}
header .ttl{flex:1;line-height:1.1}
header .ttl b{font-size:15px}
header .ttl small{display:block;color:var(--muted);font-size:11px}
header button{min-width:40px}
.pv{flex:0 0 auto;height:var(--pvh,38dvh);background:#000;position:relative;touch-action:none;overflow:hidden}
.pv canvas{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.bar{display:flex;align-items:center;gap:8px;padding:4px 10px;flex:0 0 auto;direction:ltr}
.bar .tm{font-variant-numeric:tabular-nums;color:var(--muted);flex:1;text-align:center}
.bar .tm b{color:var(--text)}
.bar button{min-width:44px}
.tlw{flex:1 1 auto;min-height:120px;position:relative;overflow:auto;direction:ltr;background:var(--panel);border-top:1px solid var(--line)}
.tli{position:relative;min-height:100%}
.ruler{position:relative;height:24px;border-bottom:1px solid var(--line);cursor:pointer}
.ruler span{position:absolute;top:4px;font-size:10px;color:var(--muted);transform:translateX(3px);pointer-events:none}
.ruler i{position:absolute;bottom:0;width:1px;height:8px;background:var(--line)}
.row{position:relative;height:46px;margin:4px 0;background:#10141b}
.row.a{background:#0f1913}
.clip{position:absolute;top:2px;height:42px;border-radius:7px;overflow:hidden;color:#fff;font-size:11px;
  padding:3px 6px;white-space:nowrap;touch-action:none;background-size:auto 100%;background-repeat:repeat-x;
  border:1px solid #fff3}
.clip.video{background-color:var(--cv)}.clip.image{background-color:var(--ci)}
.clip.text{background-color:var(--ct)}.clip.audio{background-color:var(--ca)}
.clip.sel{outline:2px solid #fff;z-index:3}
.clip .lb{position:relative;text-shadow:0 1px 2px #000;pointer-events:none}
.clip svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
.clip .h{position:absolute;top:0;width:16px;height:100%;background:#fffd;display:none;z-index:4}
.clip.sel .h{display:block}
.clip .h.l{left:0;border-radius:6px 0 0 6px}.clip .h.r{right:0;border-radius:0 6px 6px 0}
.clip .tj{position:absolute;left:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;
  background:var(--accent2);color:#000;display:grid;place-items:center;font-size:10px;z-index:5;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:8;pointer-events:none;box-shadow:0 0 0 1px #0008}
.ph::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:12px;background:#fff;border-radius:50%}
.tb{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg)}
.tb button{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:none;padding:2px 6px;font-size:11px;line-height:1.25}
.tb button span{font-size:19px;line-height:1.1}
.sheet{position:absolute;inset-inline:0;bottom:0;max-width:900px;margin:0 auto;background:var(--panel);border-radius:16px 16px 0 0;
  max-height:62dvh;display:flex;flex-direction:column;z-index:20;box-shadow:0 -8px 30px #000a;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet header{height:44px;border-bottom:1px solid var(--line)}
.sheet .body{overflow:auto;padding:8px 12px 14px;display:flex;flex-direction:column;gap:10px}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
.ctl label b{color:var(--text);direction:ltr}
.ctl input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 12px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:32px;min-height:32px;height:32px;padding:0;border-radius:50%;border:2px solid #fff3}
.sw button.sel{border-color:#fff}
.sw input[type=color]{width:38px;height:32px;padding:0;border:0;background:none}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:64px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.grid button{font-size:26px;min-height:52px}
.hint{color:var(--muted);font-size:12px}
.prog{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
input[type=file]{display:none}
#blk{position:fixed;inset:0;background:#0007;z-index:15}
#toast{position:fixed;bottom:90px;inset-inline:16px;margin:auto;max-width:420px;background:#000d;border:1px solid var(--line);
  padding:10px 14px;border-radius:12px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="ttl"><b>محرر الفيديو</b><small>Delbaz _EPS</small></div>
    <button id="bUndo" aria-label="تراجع">↩︎</button>
    <button id="bRedo" aria-label="إعادة">↪︎</button>
    <button id="bExport" class="primary">تصدير</button>
  </header>
  <div class="pv" id="pv"><canvas id="cv" width="540" height="960"></canvas></div>
  <div class="bar">
    <button id="bPlay" class="primary" aria-label="تشغيل">▶</button>
    <div class="tm"><b id="tCur">0:00.0</b> / <span id="tTot">0:00.0</span></div>
    <button id="bZm" aria-label="تصغير">−</button>
    <button id="bZp" aria-label="تكبير">+</button>
  </div>
  <div class="tlw" id="tlw"><div class="tli" id="tli"></div></div>
  <div class="tb" id="tb"></div>
</div>
<div class="sheet" id="sheet" hidden>
  <header><div class="ttl"><b id="shT"></b></div><button id="shX">✕</button></header>
  <div class="body" id="shB"></div>
</div>
<div id="blk" hidden></div>
<div id="toast"></div>
<input type="file" id="fMedia" accept="video/*,image/*,audio/*" multiple>
<input type="file" id="fSrt" accept=".srt,text/plain">

<script src="vendor/mp4-muxer.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const RATIOS = { '9:16': [1080, 1920], '16:9': [1920, 1080], '1:1': [1080, 1080], '4:5': [1080, 1350], '3:4': [1080, 1440] };
const FONTS = [
  ['Cairo', 'القاهرة'], ['Tajawal', 'تجوّل'], ['Amiri', 'أميري'], ['Reem Kufi', 'ريم كوفي'],
  ['Lalezar', 'لاليزار'], ['Aref Ruqaa', 'رقعة'], ['sans-serif', 'النظام']];
const FILTERS = [
  ['أصلي', {}], ['دافئ', { sa: 15, se: 25, br: 5 }], ['بارد', { hu: -15, sa: 10, co: 5 }],
  ['أبيض وأسود', { gr: 100, co: 10 }], ['قديم', { se: 70, co: -10, br: -5, vi: 40 }],
  ['زاهٍ', { sa: 60, co: 15 }], ['سينمائي', { co: 25, sa: -15, br: -8, vi: 35 }],
  ['باهت', { co: -25, br: 10, sa: -20 }], ['درامي', { co: 40, br: -10, sa: 10, vi: 30 }],
  ['حالم', { bl: 1, br: 10, sa: 15 }]];
const ANIMS = [['', 'بدون'], ['fade', 'ظهور'], ['zoomIn', 'تكبير'], ['zoomOut', 'تصغير'], ['slideL', 'انزلاق ←'],
  ['slideR', 'انزلاق →'], ['slideU', 'انزلاق ↑'], ['slideD', 'انزلاق ↓'], ['spin', 'دوران'], ['pop', 'قفزة']];
const TRANS = [['dissolve', 'تلاشٍ متقاطع'], ['fadeblack', 'عبر الأسود'], ['slideL', 'دفع ←'], ['slideR', 'دفع →'],
  ['slideU', 'دفع ↑'], ['zoom', 'تكبير'], ['wipe', 'مسح'], ['spin', 'دوران']];
const BLENDS = [['source-over', 'عادي'], ['multiply', 'ضرب'], ['screen', 'شاشة'], ['overlay', 'تراكب'],
  ['lighten', 'أفتح'], ['darken', 'أغمق']];
const EMOJI = ['😀','😂','😍','😎','🔥','👍','👏','🙌','💪','🎉','💯','⭐','❤️','🏃','⚽','🏀','🏐','🥇','🏆','🎯',
  '⏱️','📣','✅','❌','⚠️','➡️','⬅️','⬆️','⬇️','💡','📌','📍','🎵','🎶','🔔','☀️','🌙','⚡','💥','✨'];
const SWATCH = ['#ffffff', '#000000', '#ff4d4d', '#ffb02e', '#ffe14d', '#2fd0a8', '#4da3ff', '#b57bff'];

/* ================= state ================= */
function newProject() {
  return { pw: 1080, ph: 1920, bg: '#000000', tracks: [
    { id: uid(), type: 'v', clips: [] }, { id: uid(), type: 'v', clips: [] }, { id: uid(), type: 'a', clips: [] }] };
}
let P = newProject();
const assets = {};   // id -> {id,name,type,dur,w,h,url,blob,img,thumb,peaks}
const els = {};      // clipId -> {el,node}
let sel = null, T = 0, playing = false, wall0 = 0, t0 = 0, dirty = true, exporting = null;
let pps = 60, pending = 'main', PS = 0.5;
let hist = [], hi = -1;
const cv = $('cv'), cx = cv.getContext('2d');
const tmp = document.createElement('canvas'), tx2 = tmp.getContext('2d', { willReadFrequently: true });
const hasFilter = 'filter' in cx;

const mkClip = o => Object.assign({
  id: uid(), kind: 'video', asset: null, start: 0, dur: 3, in: 0, speed: 1, vol: 1, afi: 0, afo: 0,
  opacity: 1, x: 0, y: 0, scale: 1, rot: 0, flipH: false, flipV: false, fit: 'contain', blend: 'source-over',
  f: { br: 0, co: 0, sa: 0, hu: 0, bl: 0, se: 0, gr: 0, vi: 0 }, chroma: null, mask: 'none', blurBg: false,
  animIn: null, animOut: null, trans: null, text: null }, o);
const allClips = () => P.tracks.flatMap(t => t.clips);
const findClip = id => { for (const t of P.tracks) { const c = t.clips.find(c => c.id === id); if (c) return c; } return null; };
const trackOf = c => P.tracks.find(t => t.clips.includes(c));
const sorted = t => t.clips.slice().sort((a, b) => a.start - b.start);
const total = () => allClips().reduce((m, c) => Math.max(m, c.start + c.dur), 0);
const adj = (a, b) => Math.abs(a.start + a.dur - b.start) < 0.06;
const cur = () => sel ? findClip(sel) : null;
const fmt = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return m + ':' + (s - m * 60 < 10 ? '0' : '') + (s - m * 60).toFixed(1); };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }

/* ================= history / persistence ================= */
const snap = () => JSON.stringify(P);
function commit() {
  const s = snap(); if (hist[hi] === s) { afterChange(); return; }
  hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 60) hist.shift(); hi = hist.length - 1;
  afterChange();
}
function undo() { if (hi > 0) { hi--; P = JSON.parse(hist[hi]); fixSel(); afterChange(true); } }
function redo() { if (hi < hist.length - 1) { hi++; P = JSON.parse(hist[hi]); fixSel(); afterChange(true); } }
function fixSel() { if (sel && !findClip(sel)) sel = null; }
function afterChange(layout) {
  if (layout) applyPreviewSize();
  gcEls(); renderTL(); renderTB(); syncMedia(T, playing); dirty = true; updTime(); saveSoon();
  $('bUndo').disabled = hi <= 0; $('bRedo').disabled = hi >= hist.length - 1;
}
let idb = null;
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('delbaz_eps_editor', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
const idbOp = (store, mode, fn) => new Promise(res => {
  if (!idb) return res(null);
  try { const tx = idb.transaction(store, mode), rq = fn(tx.objectStore(store)); tx.oncomplete = () => res(rq ? rq.result : null); tx.onerror = () => res(null); }
  catch (e) { res(null); }
});
let saveT = null;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveNow, 700); }
function saveNow() {
  const meta = Object.values(assets).map(a => ({ id: a.id, name: a.name, type: a.type, dur: a.dur, w: a.w, h: a.h }));
  return idbOp('kv', 'readwrite', s => s.put({ P, meta }, 'project'));
}
async function loadSaved() {
  const d = await idbOp('kv', 'readonly', s => s.get('project'));
  if (!d || !d.P) return false;
  for (const m of d.meta || []) {
    const blob = await idbOp('blobs', 'readonly', s => s.get(m.id));
    if (blob) { await registerAsset(Object.assign({}, m, { blob })); }
  }
  P = d.P;
  P.tracks.forEach(t => t.clips = t.clips.filter(c => c.kind === 'text' || assets[c.asset]));
  return true;
}

/* ================= assets ================= */
function loadMeta(a) {
  return new Promise(res => {
    if (a.type === 'image') {
      const img = new Image(); img.onload = () => { a.img = img; a.w = img.naturalWidth; a.h = img.naturalHeight; a.dur = 0; thumbOf(a, img, a.w, a.h); res(a); };
      img.onerror = () => res(null); img.src = a.url; return;
    }
    const v = document.createElement(a.type === 'video' ? 'video' : 'audio'); v.preload = 'auto'; v.muted = true;
    v.onloadedmetadata = () => {
      a.dur = isFinite(v.duration) ? v.duration : 0;
      if (a.type === 'video') {
        a.w = v.videoWidth; a.h = v.videoHeight;
        v.onseeked = () => { thumbOf(a, v, a.w, a.h); res(a); };
        v.currentTime = Math.min(0.3, a.dur / 2);
      } else res(a);
    };
    v.onerror = () => res(null); v.src = a.url;
  });
}
function thumbOf(a, src, w, h) {
  try {
    const c = document.createElement('canvas'); const hh = 84, ww = Math.max(1, Math.round(hh * w / h));
    c.width = ww; c.height = hh; c.getContext('2d').drawImage(src, 0, 0, ww, hh); a.thumb = c.toDataURL('image/jpeg', .6);
  } catch (e) {}
}
async function registerAsset(a) {
  a.url = URL.createObjectURL(a.blob); assets[a.id] = a;
  const r = await loadMeta(a); if (!r) { delete assets[a.id]; return null; } return a;
}
async function importFile(file) {
  const type = file.type.startsWith('video') ? 'video' : file.type.startsWith('image') ? 'image' : file.type.startsWith('audio') ? 'audio' : null;
  if (!type) { toast('نوع ملف غير مدعوم: ' + file.name); return null; }
  const a = { id: uid(), name: file.name, type, blob: file, dur: 0, w: 0, h: 0 };
  const r = await registerAsset(a); if (!r) { toast('تعذّر فتح: ' + file.name); return null; }
  idbOp('blobs', 'readwrite', s => s.put(file, a.id)); return a;
}

/* ================= track / clip placement ================= */
const free = (tr, s, d, ex) => !tr.clips.some(c => c !== ex && s < c.start + c.dur - 1e-6 && s + d > c.start + 1e-6);
function visIdx() { return P.tracks.map((t, i) => t.type === 'v' ? i : -1).filter(i => i >= 0); }
function addTrack(type) {
  const t = { id: uid(), type, clips: [] };
  if (type === 'v') { const v = visIdx(); P.tracks.splice(v[v.length - 1] + 1, 0, t); } else P.tracks.push(t);
  return t;
}
function placeClip(c, prefer) {
  const type = c.kind === 'audio' ? 'a' : 'v';
  let idxs = P.tracks.map((t, i) => t.type === type ? i : -1).filter(i => i >= 0);
  idxs = idxs.filter(i => i >= (prefer || 0));
  let tr = null;
  for (const i of idxs) if (free(P.tracks[i], c.start, c.dur)) { tr = P.tracks[i]; break; }
  if (!tr) tr = addTrack(type);
  tr.clips.push(c); sel = c.id; return c;
}
function trackEnd(tr) { return tr.clips.reduce((m, c) => Math.max(m, c.start + c.dur), 0); }
function clipFromAsset(a, start) {
  const dur = a.type === 'image' ? 3 : a.dur;
  return mkClip({ kind: a.type, asset: a.id, start, dur, in: 0 });
}
async function addFiles(files, target) {
  let n = 0;
  for (const f of files) {
    const a = await importFile(f); if (!a) continue;
    if (a.type === 'audio') {
      const c = clipFromAsset(a, T); c.kind = 'audio'; placeClip(c, 0);
    } else if (target === 'overlay') {
      placeClip(clipFromAsset(a, T), 1);
    } else {
      const v = visIdx()[0]; placeClip(clipFromAsset(a, trackEnd(P.tracks[v])), 0);
    }
    n++;
  }
  if (n) { commit(); toast('تمت إضافة ' + n + ' ملف'); if (total() > 0 && P.tracks.every(t => !t.clips.length || true)) fitZoom(); }
}

/* ================= element / audio engine ================= */
let AC = null, dest = null;
function ensureAC() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)(); dest = AC.createMediaStreamDestination();
    for (const id in els) attachAudio(els[id]);
  } catch (e) { AC = null; }
}
function attachAudio(e) {
  if (!AC || e.node || e.fail) return;
  try {
    const s = AC.createMediaElementSource(e.el), g = AC.createGain();
    s.connect(g); g.connect(AC.destination); g.connect(dest); e.node = { s, g };
  } catch (err) { e.fail = true; }
}
function getEl(c) {
  let e = els[c.id]; if (e) return e;
  const a = assets[c.asset]; const el = document.createElement(a.type === 'video' ? 'video' : 'audio');
  el.preload = 'auto'; el.playsInline = true; el.src = a.url;
  el.addEventListener('seeked', () => dirty = true); el.addEventListener('loadeddata', () => dirty = true);
  e = els[c.id] = { el, node: null }; attachAudio(e); return e;
}
function gcEls() {
  const ids = new Set(allClips().map(c => c.id));
  for (const id in els) if (!ids.has(id)) { try { els[id].el.pause(); els[id].el.removeAttribute('src'); } catch (e) {} delete els[id]; }
}
function srcTime(c, t) {
  const a = assets[c.asset], hi2 = (a && a.dur ? a.dur : 1e9) - 0.04;
  return clamp(c.in + (t - c.start) * c.speed, c.in, Math.min(hi2, c.in + c.dur * c.speed));
}
function audioGain(c, t) {
  let g = c.vol; const l = t - c.start, r = c.start + c.dur - t;
  if (c.afi > 0 && l < c.afi) g *= clamp(l / c.afi, 0, 1);
  if (c.afo > 0 && r < c.afo) g *= clamp(r / c.afo, 0, 1);
  return g;
}
function setGain(e, g) { if (e.node) e.node.g.gain.value = g; else e.el.volume = clamp(g, 0, 1); }
function holdWindow(c, t) {
  const tr = trackOf(c); if (!tr || c.kind !== 'video') return false;
  const L = sorted(tr), i = L.indexOf(c);
  const tin = c.trans && L[i - 1] && adj(L[i - 1], c) ? c.trans.d / 2 : 0;
  const n = L[i + 1], tout = n && n.trans && adj(c, n) ? n.trans.d / 2 : 0;
  return t >= c.start - tin && t <= c.start + c.dur + tout;
}
function syncMedia(t, play) {
  for (const c of allClips()) {
    if (c.kind !== 'video' && c.kind !== 'audio') continue;

  const d2 = JSON.parse(JSON.stringify(c)); d2.id = uid(); d2.start = t; d2.dur = c.start + c.dur - t;
  if (c.kind === 'video' || c.kind === 'audio') d2.in = c.in + (t - c.start) * c.speed;
  c.dur = t - c.start; c.animOut = null; d2.animIn = null; d2.trans = null;
  trackOf(c).clips.push(d2); return d2;
}
function doSplit() {

  sel = n.id; commit();
}
function doDelete() {

}
function doFreeze() {

  if (T <= c.start + 0.05 || T >= c.start + c.dur - 0.05) return toast('ضع المؤشر داخل المقطع.');

  cc.getContext('2d').drawImage(e.el, 0, 0);

    const tr = trackOf(c), n = splitAt(c, T);

    const im = clipFromAsset(a, T); im.dur = 2; im.fit = c.fit; im.scale = c.scale; im.x = c.x; im.y = c.y; im.f = Object.assign({}, c.f);

  }, 'image/png');
}
function doDetach() {

/* ================= SRT ================= */
function parseSrt(txt) {
  const out = [], blocks = txt.replace(/\r/g, '').split(/\n\s*\n/);
  const tm = s => { const m = s.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] + +m[4] / 1000 : null; };
  for (const b of blocks) {
    const ln = b.split('\n').filter(l => l.trim() !== ''); const i = ln.findIndex(l => l.includes('-->')); if (i < 0) continue;
    const [a, z] = ln[i].split('-->'), s = tm(a), e = tm(z); if (s == null || e == null || e <= s) continue;
    out.push({ s, e, t: ln.slice(i + 1).join('\n') });
  }
  return out;
}
function importSrt(txt) {
  const items = parseSrt(txt); if (!items.length) return toast('ملف ترجمة غير صالح.');
  const tr = addTrack('v');
  items.forEach(it => tr.clips.push(mkClip({ kind: 'text', start: it.s, dur: it.e - it.s, y: P.ph * 0.3,
    text: { s: it.t, font: 'Cairo', size: 60, color: '#ffffff', bold: true, sw: 5, sc: '#000000', bgA: .35, bgc: '#000000' } })));
  commit(); toast('تم استيراد ' + items.length + ' سطر ترجمة');
}
function exportSrt() {
  const t = allClips().filter(c => c.kind === 'text').sort((a, b) => a.start - b.start);
  if (!t.length) return toast('لا توجد نصوص لتصديرها.');
  const f = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + x.toFixed(3).padStart(6, '0').replace('.', ','); };
  const s = t.map((c, i) => `${i + 1}\n${f(c.start)} --> ${f(c.start + c.dur)}\n${c.text.s}\n`).join('\n');
  dl(new Blob([s], { type: 'text/plain' }), 'subtitles.srt');
}
function dl(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ================= fast export (WebCodecs + mp4-muxer) ================= */
const FAST_OK = typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined' && typeof Mp4Muxer !== 'undefined';

  return audioCache[a.id] = buf;
}
async function mixAudio(tot, sr) {
  const oc = new OfflineAudioContext(2, Math.ceil(tot * sr), sr); let any = false;
  for (const c of allClips()) {
    if ((c.kind !== 'video' && c.kind !== 'audio') || c.vol <= 0) continue;
    const a = assets[c.asset]; if (!a) continue; const buf = await decodeAsset(a); if (!buf) continue;
    const src = oc.createBufferSource(); src.buffer = buf; src.playbackRate.value = c.speed;
    const g = oc.createGain(), t0 = c.start, t1 = c.start + c.dur, fi = Math.min(c.afi, c.dur), fo = Math.min(c.afo, c.dur);
    g.gain.setValueAtTime(fi > 0 ? 0 : c.vol, t0); if (fi > 0) g.gain.linearRampToValueAtTime(c.vol, t0 + fi);
    if (fo > 0) { g.gain.setValueAtTime(c.vol, Math.max(t0 + fi, t1 - fo)); g.gain.linearRampToValueAtTime(0, t1); }
    src.connect(g); g.connect(oc.destination); src.start(t0, c.in); src.stop(t1); any = true;

}
async function seekAllAt(t) {

    const el = getEl(c).el; if (!el.paused) el.pause(); el.muted = true;

async function exportFast(q, job, progress) {
  const tot = total(), fps = 30, t00 = performance.now();
  const sc = q / Math.min(P.pw, P.ph), W = Math.round(P.pw * sc / 2) * 2, H = Math.round(P.ph * sc / 2) * 2;
  if (playing) stop();
  const vbase = { width: W, height: H, bitrate: q >= 1080 ? 10e6 : q >= 720 ? 6e6 : 3e6, framerate: fps };
  let vc = null;
  for (const [fam, str] of [['avc', 'avc1.64002A'], ['avc', 'avc1.4D4028'], ['avc', 'avc1.42E01F'], ['vp9', 'vp09.00.40.08'], ['av1', 'av01.0.08M.08']]) {

    video: { codec: vc[0], width: W, height: H, frameRate: fps }, audio: mix ? { codec: ac[0], numberOfChannels: 2, sampleRate: 48000 } : undefined });

    aenc.configure({ codec: ac[1], sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 });

/* ================= export ================= */
function startExport(q, bar, info, btn) {
  ensureAC(); if (AC) AC.resume();
  const sc = q / Math.min(P.pw, P.ph), W = Math.round(P.pw * sc / 2) * 2, H = Math.round(P.ph * sc / 2) * 2;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const stream = c.captureStream(30); if (dest) dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mime) { toast('هذا المتصفح لا يدعم التصدير.'); btn.disabled = false; return; }
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: q >= 1080 ? 10e6 : q >= 720 ? 6e6 : 3e6 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);

  const tot = total(); const tick = setInterval(() => { if (!exporting) return clearInterval(tick); bar.style.width = Math.round(T / tot * 100) + '%'; info.textContent = 'جارٍ التصدير… ' + Math.round(T / tot * 100) + '%'; }, 250);
